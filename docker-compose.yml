# Local Postgres for development. Matches DATABASE_URL in .env.example.
services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
      POSTGRES_DB: template
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
